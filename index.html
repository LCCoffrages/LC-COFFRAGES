    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="LC Coffrages">
    <meta name="theme-color" content="#1e3a8a">

    <link rel="apple-touch-icon" href="./apple-touch-icon.png">

    <title>Configurateur LC Coffrages</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bleu: #1e3a8a;
            --bleu-clair: #e8edf8;
            --fond: #eef1f5;
            --carte: #ffffff;
            --trait: #d7dde6;
            --texte: #0f172a;
            --gris: #5b6678;
            --rayon: 14px;
            --touche: 56px;           /* hauteur mini d'une zone a toucher */
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { -webkit-text-size-adjust: 100%; }
        body {
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background: var(--fond); color: var(--texte);
            margin: 0; padding: 0; overscroll-behavior: none;
            font-size: 16px;
        }
        button, input { font-family: inherit; }

        /* --- EN-TETE --- */
        header {
            position: sticky; top: 0; z-index: 50;
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            background: #fff; border-bottom: 1px solid var(--trait);
            padding: 10px 16px; padding-top: max(10px, env(safe-area-inset-top));
        }
        header img { height: 30px; width: auto; display: block; }
        .titre-app { text-align: right; line-height: 1.15; }
        .titre-app b { display: block; font-size: 0.95rem; color: var(--bleu); letter-spacing: .02em; }
        .titre-app span { font-size: 0.78rem; color: var(--gris); }

        /* --- MISE EN PAGE --- */
        .page { max-width: 1180px; margin: 0 auto; padding: 12px 12px 40px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
        .colonne { display: grid; gap: 12px; align-content: start; min-width: 0; }
        @media (min-width: 900px) {
            .page { grid-template-columns: 380px minmax(0, 1fr); padding: 20px; gap: 20px; }
            .colonne { gap: 16px; }
        }
        .carte {
            background: var(--carte); border: 1px solid var(--trait); border-radius: var(--rayon);
            padding: 14px; box-shadow: 0 1px 2px rgba(15, 23, 42, .04);
        }
        .carte h2 {
            margin: 0 0 10px; font-size: 0.8rem; font-weight: 700; letter-spacing: .06em;
            text-transform: uppercase; color: var(--bleu);
            display: flex; align-items: center; justify-content: space-between;
        }
        .lien {
            border: 0; background: none; color: var(--gris); font-size: .8rem; font-weight: 600;
            text-transform: none; letter-spacing: 0; min-height: 48px; min-width: 64px; padding: 0 8px; margin: -12px -8px -12px 0; cursor: pointer;
        }

        /* --- SAISIE DES COTES --- */
        .cotes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .champ { display: block; }
        .champ.large { grid-column: 1 / -1; }
        .champ > span { display: block; font-size: .82rem; font-weight: 600; color: var(--gris); margin: 0 0 5px 2px; }
        .saisie { position: relative; }
        .saisie input {
            width: 100%; height: 60px; border: 2px solid var(--trait); border-radius: 12px;
            padding: 0 44px 0 14px; font-size: 1.6rem; font-weight: 700; color: var(--texte);
            background: #fff; outline: none; font-variant-numeric: tabular-nums;
        }
        .saisie input::placeholder { color: #a8b1bf; font-weight: 500; font-size: 1rem; }
        .saisie input:focus { border-color: var(--bleu); box-shadow: 0 0 0 3px rgba(30, 58, 138, .15); }
        .saisie input.erreur { border-color: #dc2626; }
        .saisie .unite { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--gris); font-weight: 600; pointer-events: none; }
        .champ.large .saisie input { font-size: 1.3rem; height: 54px; }

        /* --- CHOIX (boutons a bascule) --- */
        .choix { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .choix button {
            min-height: 64px; border: 2px solid var(--trait); border-radius: 12px; background: #fff;
            display: flex; align-items: center; gap: 10px; padding: 8px 12px; text-align: left;
            color: var(--texte); cursor: pointer; font-size: 1rem;
        }
        .choix button svg { flex: 0 0 auto; width: 30px; height: 30px; stroke: currentColor; }
        .choix button b { display: block; font-size: 1.02rem; }
        .choix button small { display: block; color: var(--gris); font-size: .8rem; }
        .choix button[aria-pressed="true"] { border-color: var(--bleu); background: var(--bleu-clair); color: var(--bleu); }
        .choix button[aria-pressed="true"] small { color: var(--bleu); }
        .choix.petit button { min-height: var(--touche); justify-content: center; text-align: center; }
        .sous-choix { margin-top: 12px; }
        .sous-choix > span { display: block; font-size: .82rem; font-weight: 600; color: var(--gris); margin: 0 0 6px 2px; }

        /* --- OPTIONS (interrupteurs) --- */
        .option {
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
            min-height: 64px; padding: 8px 2px; cursor: pointer; border-top: 1px solid var(--trait);
            position: relative;
        }
        .option:first-of-type { border-top: 0; }
        .option b { display: block; font-size: 1rem; }
        .option small { display: block; color: var(--gris); font-size: .8rem; margin-top: 2px; }
        .option input { position: absolute; opacity: 0; width: 1px; height: 1px; }
        .interrupteur {
            flex: 0 0 auto; width: 58px; height: 34px; border-radius: 34px; background: #cbd3de;
            position: relative; transition: background .15s;
        }
        .interrupteur::after {
            content: ""; position: absolute; top: 3px; left: 3px; width: 28px; height: 28px; border-radius: 50%;
            background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .15s;
        }
        .option input:checked + .interrupteur { background: var(--bleu); }
        .option input:checked + .interrupteur::after { transform: translateX(24px); }
        .option input:focus-visible + .interrupteur { outline: 3px solid rgba(30,58,138,.35); outline-offset: 2px; }

        /* --- A PREPARER --- */
        .ligne-prep {
            display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 4px 12px;
            padding: 12px 2px; border-top: 1px solid var(--trait);
        }
        .ligne-prep:first-of-type { border-top: 0; padding-top: 2px; }
        .ligne-prep .nom { font-weight: 600; }
        .ligne-prep .detail { grid-column: 1 / -1; color: var(--gris); font-size: .85rem; }
        .ligne-prep .valeur { font-size: 1.45rem; font-weight: 800; color: var(--bleu); text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .ligne-prep .valeur small { font-size: .85rem; font-weight: 600; color: var(--gris); }
        .ligne-prep .detail.attention { color: #b45309; }
        .note { margin: 10px 2px 0; font-size: .78rem; color: var(--gris); }
        .vide { color: var(--gris); padding: 8px 2px; }

        /* --- PLAN --- */
        .plan { padding: 0; overflow: hidden; }
        .plan-tete { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 0; gap: 8px; }
        .plan-tete h2 { margin: 0; }
        .visualization {
            position: relative; background: #c4ccd8; margin-top: 10px;
            display: flex; flex-direction: column; align-items: center; overflow: hidden;
        }
        canvas {
            display: block; width: 100%; max-width: 760px; height: auto; aspect-ratio: 1 / 1;
            touch-action: manipulation; cursor: zoom-in;
        }
        canvas:active { cursor: grabbing; }
        .zoom-controls {
            display: flex; gap: 8px; justify-content: center; width: 100%;
            padding: 8px; background: #b9c2cf; z-index: 5;
        }
        .visualization.fs .zoom-controls {
            position: absolute; left: 0; right: 0; bottom: 0; width: auto; background: transparent;
            padding-bottom: max(12px, env(safe-area-inset-bottom));
        }
        .zoom-controls button, #fsClose {
            width: 48px; height: 48px; border-radius: 12px; border: 1px solid var(--trait);
            background: rgba(255,255,255,.95); color: var(--bleu); font-size: 1.4rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 2px 6px rgba(15,23,42,.12);
        }
        .zoom-badge { display: none; }
        .plan-aide { padding: 8px 14px 12px; font-size: .78rem; color: var(--gris); }
        .bouton-plein {
            border: 1px solid var(--trait); background: #fff; color: var(--bleu); font-weight: 700; font-size: .85rem;
            min-height: 48px; padding: 0 14px; border-radius: 10px; cursor: pointer;
        }
        #fsClose { display: none; position: absolute; top: calc(12px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); z-index: 6; font-size: 1.8rem; width: 56px; height: 56px; }
        .visualization.fs canvas { touch-action: none; cursor: grab; }
        body.plein { overflow: hidden; }
        .aide-champ { margin: 8px 2px 0; font-size: .85rem; font-weight: 600; color: #dc2626; }
        .aide-champ:empty { display: none; }
        .visualization.fs {
            position: fixed; inset: 0; margin: 0; z-index: 9999; background: #c4ccd8;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        .visualization.fs { justify-content: center; }
        .visualization.fs canvas { width: min(100vw, 100vh); max-width: none; }
        .visualization.fs #fsClose { display: flex; }
        .message-plan {
            position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
            text-align: center; padding: 24px; color: var(--gris); font-weight: 600; background: #c4ccd8; z-index: 4;
        }
        .visualization.sans-plan .message-plan { display: flex; }
    </style>
</head>

                        <button type="button" onclick="zoomBy(1.25)" aria-label="Zoom avant">+</button>
                        <button type="button" onclick="zoomBy(1/1.25)" aria-label="Zoom arrière">−</button>
                        <button type="button" onclick="resetView()" aria-label="Recentrer">⟲</button>
                    </div>
                    <div class="zoom-badge" id="zoomBadge">100%</div>

<script>
    const e = 0.065; // Cadre 65 mm (CP 15 mm + bastaing 50 mm)

    // --- VIEW STATE (zoom/pan du canvas) ---
    const view = { zoom: 1, panX: 0, panY: 0 };
    const ZOOM_MIN = 0.5, ZOOM_MAX = 12;

    function clampZoom(z) { return Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z)); }

    function updateZoomBadge() {
        const b = document.getElementById('zoomBadge');
        if (b) b.textContent = Math.round(view.zoom * 100) + '%';
    }

    function zoomBy(factor) {
        const canvas = document.getElementById('monDessin');
        const mx = canvas.width / 2, my = canvas.height / 2;
        const newZoom = clampZoom(view.zoom * factor);
        const realFactor = newZoom / view.zoom;
        view.panX = mx - (mx - view.panX) * realFactor;
        view.panY = my - (my - view.panY) * realFactor;
        view.zoom = newZoom;
        calculer();
    }

    function resetView() {
        view.zoom = 1; view.panX = 0; view.panY = 0;
        calculer();
    }

    // Tap sur l'image -> agrandit en plein ecran (et re-tap pour revenir)
    function toggleFullscreen() {
        const viz = document.querySelector('.visualization');
        const plein = viz.classList.toggle('fs');
        document.body.classList.toggle('plein', plein);
        resetView();   // recentre le dessin a la nouvelle taille
        if (plein) document.getElementById('fsClose').focus();
    }
    document.addEventListener('keydown', ev => {
        if (ev.key === 'Escape' && document.querySelector('.visualization.fs')) toggleFullscreen();
    });

    // --- SAISIE TELEPHONE (refonte 21/10/2026) ---
    // Les gars tapent « 1,50 » : la virgule est acceptee.
    function lire(id) {
        const v = String(document.getElementById(id).value || '').trim().replace(',', '.');
        return /^(\d+\.?\d*|\.\d+)$/.test(v) ? Number(v) : NaN;   // « 2abc » ou « 1,2,5 » : refuse
    }
    function choisirType(v) {
        document.getElementById('typeMannequin').value = v;
        document.querySelectorAll('[data-type]').forEach(b => b.setAttribute('aria-pressed', b.dataset.type === v ? 'true' : 'false'));
        calculer();
    }
    function choisirBas(v) {
        document.getElementById('renfortBas').value = v;
        document.querySelectorAll('[data-bas]').forEach(b => b.setAttribute('aria-pressed', b.dataset.bas === v ? 'true' : 'false'));
        calculer();
    }
    // Le dernier mannequin saisi revient a la reouverture (memoire du telephone, facultative)
    const CLE = 'lc-mannequin-saisie';
    function sauverSaisie() {
        try {
            localStorage.setItem(CLE, JSON.stringify({
                l: document.getElementById('largeur').value, h: document.getElementById('hauteur').value,
                ep: document.getElementById('epaisseur').value, type: document.getElementById('typeMannequin').value,
                bas: document.getElementById('renfortBas').value,
                sf: document.getElementById('sansFace').checked, beton: document.getElementById('renforce').checked
            }));
        } catch (err) {}
    }
    function restaurerSaisie() {
        let s = null;
        try { s = JSON.parse(localStorage.getItem(CLE) || 'null'); } catch (err) {}
        if (!s) return;
        if (typeof s.l === 'string') document.getElementById('largeur').value = s.l;
        if (typeof s.h === 'string') document.getElementById('hauteur').value = s.h;
        if (typeof s.ep === 'string') document.getElementById('epaisseur').value = s.ep;
        document.getElementById('sansFace').checked = !!s.sf;
        document.getElementById('renforce').checked = !!s.beton;
        if (s.bas === '0.10' || s.bas === '0.20') choisirBas(s.bas);
        if (s.type === '3' || s.type === '4') choisirType(s.type);
    }
    function nouveauMannequin() {
        ['largeur', 'hauteur', 'epaisseur'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('sansFace').checked = false;
        document.getElementById('renforce').checked = false;
        choisirBas('0.20');
        choisirType('4');
        resetView();
        document.getElementById('largeur').focus();
    }

    function calculer() {
        const L = lire('largeur');
        const H = lire('hauteur');
        const type = document.getElementById('typeMannequin').value;
        const isReinforced = document.getElementById('renforce').checked;
        // 1er renfort du bas d'une porte : 20 cm de serie, 10 cm sur demande du client (Kevin, 21/10/2026)
        const renfortBas = parseFloat(document.getElementById('renfortBas').value);
        // Sans face coffrante : pas de CP 15 mm, l'ossature fait la cote finie (Kevin, 21/10/2026).
        // Le nombre de renforts reste celui du chiffrage (qui ne change pas non plus).
        const sansFace = document.getElementById('sansFace').checked;
        const CP = sansFace ? 0 : 0.015, BA = 0.050;   // CP et bastaing du cadre
        document.getElementById('groupeRenfortBas').style.display = (type == "3") ? "" : "none";
        const canvas = document.getElementById('monDessin');
        const ctx = canvas.getContext('2d');
        const resBox = document.getElementById('resultats');

        // Cotes absentes ou hors limites : on le dit au lieu d'un plan faux
        const cotesOk = !isNaN(L) && !isNaN(H) && L >= 0.30 && H >= 0.30 && L <= 8 && H <= 8;
        document.getElementById('largeur').classList.toggle('erreur', !(L >= 0.30 && L <= 8));
        document.getElementById('hauteur').classList.toggle('erreur', !(H >= 0.30 && H <= 8));
        document.querySelector('.visualization').classList.toggle('sans-plan', !cotesOk);
        {
            const msg = [];
            const vide = id => String(document.getElementById(id).value).trim() === '';
            if (!vide('largeur') && !(L >= 0.30 && L <= 8)) msg.push('Largeur : un nombre entre 0,30 et 8,00 m');
            if (!vide('hauteur') && !(H >= 0.30 && H <= 8)) msg.push('Hauteur : un nombre entre 0,30 et 8,00 m');
            const ep = lire('epaisseur');
            const epFaux = !vide('epaisseur') && !(ep > 0 && ep <= 1);
            document.getElementById('epaisseur').classList.toggle('erreur', epFaux);
            if (epFaux) msg.push('Épaisseur : laissez vide ou tapez par ex. 0,20');
            document.getElementById('aideCotes').textContent = msg.join(' · ');
        }
        if (!cotesOk) {
            resBox.innerHTML = '<p class="vide">Entrez la largeur et la hauteur du mannequin (en mètres, de 0,30 à 8,00).</p>';
            sauverSaisie();
            return;
        }

        updateZoomBadge();

        // ==========================================
        // 1. CALCULS (LOGIQUE INCHANGÉE)
        // ==========================================
        
        // ===== GEOMETRIE (cadre 65 mm) + bras de force + renforts — regles reelles Kevin =====
        // Bras de force : le PLUS GROS (50/60/80) tel que 2 x projection tient dans la
        // largeur INTERIEURE (Largeur - 2*cadre). Ex : 1.20 m -> interieur 1.07 m -> bras 60.
        const PROJ = { 50: 0.354, 60: 0.424, 80: 0.566 };
        const interLargeur = L - 2 * e;
        let bras, proj;
        if (2 * PROJ[80] <= interLargeur) { bras = 80; proj = PROJ[80]; }
        else if (2 * PROJ[60] <= interLargeur) { bras = 60; proj = PROJ[60]; }
        else { bras = 50; proj = PROJ[50]; }

        // Regle renforts : <= 60 cm entre 2 renforts, <= 30 cm depuis un bras de force.
        // Zone libre <= 50 cm -> 0 renfort. Sinon renforts espaces de 60 cm PILE, centres.
        // Logique : ENTRAXE 60 cm par defaut (standard). Renfort/bras = 45 mm d'epaisseur.
        // SEULEMENT quand on est trop juste (le 60 cm imposerait un renfort de plus), on
        // passe en VIDE : entraxe 64,5 cm = 60 cm de vide, pour economiser ce renfort.
        // Vide <= 50 cm entre les 2 bras -> 0 renfort. Tolerance 3 cm sur les 30 cm aux bras.
        const EP = 0.045;
        const ENT = 0.60;             // entraxe par defaut (60 cm entre renforts)
        const ENT_VIDE = 0.60 + EP;   // 64,5 cm (raisonnement vide, quand trop juste)
        const TOL = 0.06;
        function nbAvec(Z, ent) {
            return (Z <= 0.50 + 1e-6) ? 0 : Math.ceil((Z - TOL) / ent - 1e-9);
        }
        function nbRenforts(Z) { return nbAvec(Z, ENT_VIDE); }   // le minimum (le vide ne donne jamais plus)
        function posRenforts(a, b) {
            const Z = b - a;
            const nV = nbAvec(Z, ENT_VIDE), nE = nbAvec(Z, ENT);
            const arr = [];
            if (isReinforced) {
                // Beton autoplacant (+1), comme le chiffrage : un renfort de plus,
                // tous repartis a egale distance entre les bras de force (Kevin, 21/10/2026)
                const n = nV + 1;
                for (let i = 1; i <= n; i++) arr.push(a + Z * i / (n + 1));
                return arr;
            }
            const n = nV;
            if (n > 0) {
                // entraxe 60 cm par defaut ; passe au vide (64,5 cm) SEULEMENT si ca evite un renfort
                const ent = (nV < nE) ? ENT_VIDE : ENT;
                const start = a + (Z - (n - 1) * ent) / 2;
                for (let i = 0; i < n; i++) arr.push(start + i * ent);
            }
            return arr;
        }

        // Renforts HORIZONTAUX : zone verticale entre les apex des bras de force
        let y_ref_bas = (type == "3") ? 0.20 : e;   // 3 faces : renfort du bas a 20 cm (le +1)
        let y_ref_haut = H - e;
        let limit_bas = y_ref_bas + proj;
        let limit_haut = y_ref_haut - proj;
        let zone_libre = limit_haut - limit_bas;
        let renforts_h = posRenforts(limit_bas, limit_haut);

        // Renforts VERTICAUX : zone horizontale entre les apex des bras de force
        let renforts_v = posRenforts(e + proj, (L - e) - proj);

        // Compteurs affiches
        let nb_renforts_h = renforts_h.length + (type == "3" ? 1 : 0);   // + le renfort du bas (porte)
        let nb_v = renforts_v.length;

        // Bras dessine : il faut 5 cm de vide entre les deux bras d'un meme cote ; si aucun bras standard
        // ne passe, bras coupe sur mesure, longueur arrondie aux 5 cm en dessous (Kevin, 21/10/2026).
        // Le NOMBRE de renforts reste celui du chiffrage (calcule avec le bras standard).
        const VIDE_BRAS = 0.03;   // 3 cm mini entre deux pointes (Kevin : « rester pragmatique », 1,27 x 1,76 -> bras 80, 38 mm)
        const interL = L - 2 * (CP + BA);
        const interH = (type == "3") ? (H - CP - BA) - (renfortBas + 0.0225) : H - 2 * (CP + BA);
        const projMax = (Math.min(interL, interH) - VIDE_BRAS) / 2;
        // On prend le plus grand bras standard (80, 60, 50) qui laisse ces 5 cm ; la cote sur mesure
        // n'est donnee que quand meme le 50 ne passe pas.
        let brasCm, projB, brasSurMesure = false, deuxAngles = false;
        const brasStd = [80, 60, 50].find(b => PROJ[b] <= projMax + 1e-9);
        if (brasStd) { brasCm = brasStd; projB = PROJ[brasStd]; }
        else {
            // Petit mannequin (Kevin, 21/10/2026, ex. 0,60 x 1,33) : bras de 50 ou 40 dans DEUX angles
            // opposes seulement (haut gauche, bas droite) : ils ne se genent plus, il suffit qu'un bras
            // tienne seul (5 cm de vide). Sur mesure seulement si meme le 40 ne passe pas.
            deuxAngles = true;
            const projMax1 = Math.min(interL, interH) - VIDE_BRAS;
            const b2 = [50, 40].find(b => b / 100 / Math.SQRT2 <= projMax1 + 1e-9);
            if (b2) { brasCm = b2; projB = b2 / 100 / Math.SQRT2; }
            else {
                brasCm = Math.max(0, Math.floor(projMax1 * Math.SQRT2 * 100 / 5 + 1e-9) * 5);
                projB = brasCm / 100 / Math.SQRT2;
                brasSurMesure = true;
            }
        }

        // Bras dans 2 angles (ou pas la place entre les pointes) + beton autoplacant (Kevin, 21/10/2026,
        // cas 0,60 x 0,80 / 1,50 x 0,80...) :
        // le renfort horizontal du beton ne passe pas entre les bras -> on ne le met pas ; les renforts
        // verticaux se font alors dans la section du renfort horizontal, 45x145 d'une piece (au lieu de
        // 2 planches 27x145).
        let verticaux45 = false;
        const placeEntreBras = ((H - CP - BA - projB) - ((type == "3") ? renfortBas + 0.0225 + projB : CP + BA + projB));
        if (isReinforced && renforts_h.length > 0 && (deuxAngles || placeEntreBras < 0.045 + 2 * 0.03)) {
            renforts_h = renforts_h.slice(0, renforts_h.length - 1);
            nb_renforts_h = renforts_h.length + (type == "3" ? 1 : 0);
            verticaux45 = true;
        }

        // Renforts VERTICAUX en fabrication (Kevin, 21/10/2026) : le tableur de prix en compte plus et
        // on le garde ; a l'atelier : autant de renforts que de metres pleins de largeur (4,30 -> 4,
        // 3,20 -> 3), repartis a egale distance sur la largeur de l'ossature, sans tenir compte des bras.
        {
            const NLf = L - 2 * CP;                                  // largeur de l'ossature
            // si le tableur n'en compte aucun (largeur < 1,77 m), les gars n'en mettent pas non plus
            const nTableur = renforts_v.length - (isReinforced ? 1 : 0);   // regle du tableur, sans le +1
            const n = (nTableur == 0 ? 0 : Math.floor(L + 1e-9)) + (isReinforced ? 1 : 0);   // beton autoplacant : +1
            // une planche (145) ne doit pas se poser sur le bout d'un bras : sinon un renfort de moins
            // (2,00 x 2,00 -> 1 planche centree, Kevin 21/10/2026)
            let m = n;
            while (m > 0 && NLf / (m + 1) - 0.145 / 2 < BA + projB - 1e-9) m--;   // planche de 145
            renforts_v = Array.from({ length: m }, (_, i) => NLf * (i + 1) / (m + 1) + CP);   // repere fini
            nb_v = renforts_v.length;
        }

        // Porte : le NOMBRE reste celui du chiffrage (renfort du bas a 20 cm) ; les renforts sont
        // repartis entre le renfort du bas (20 ou 10 cm) et le haut de l'ossature nue (Kevin, 21/10/2026)
        if (type == "3" && renforts_h.length > 0) {
            const n = renforts_h.length, haut = H - CP, Zp = haut - renfortBas;
            const ent = (n > 1) ? renforts_h[1] - renforts_h[0] : 0;
            if (!isReinforced)
                renforts_h = Array.from({ length: n }, (_, i) => renfortBas + (Zp - (n - 1) * ent) / 2 + i * ent);
        }
        // Vide de plus de 65 cm entre les pointes des bras sans aucun renfort (hors beton) : 1 renfort au
        // milieu (Kevin, 21/10/2026 : « 60-65 cm, pas besoin » ; ex. 1,27 x 1,76 sans face = 81 cm)
        {
            const lo = (type == "3") ? renfortBas + 0.0225 + projB : CP + BA + projB;
            const hi = H - CP - BA - projB;
            if (!isReinforced && renforts_h.length == 0 && hi - lo > 0.65 + 1e-6) {
                renforts_h = [(lo + hi) / 2];
                nb_renforts_h = renforts_h.length + (type == "3" ? 1 : 0);
            }
        }
        // Aucun renfort horizontal ne doit traverser un bras de force (Kevin, 21/10/2026, option 1) :
        // beton autoplacant, ou renfort qui tomberait dans un bras -> tous repartis a egale distance
        // entre les pointes des bras, a 3 cm de marge (bras dessines, repere fini).
        if (renforts_h.length > 0) {
            const lo = (type == "3") ? renfortBas + 0.0225 + projB : CP + BA + projB;
            const hi = H - CP - BA - projB;
            const croise = renforts_h.some(y => y - 0.0225 < lo - 1e-6 || y + 0.0225 > hi + 1e-6);
            // 1er et dernier renfort a 3 cm des pointes des bras (bord du renfort), les autres a egale distance
            const MARGE = 0.03, y1 = lo + MARGE + 0.0225, y2 = hi - MARGE - 0.0225;
            if ((isReinforced || croise) && y2 >= y1) {
                const n = renforts_h.length;
                // 450 mm maxi entre deux renforts (Kevin, 21/10/2026) : sinon on resserre au milieu
                // et on s'ecarte un peu plus des bras
                const ent = (n > 1) ? Math.min((y2 - y1) / (n - 1), 0.45) : 0;
                const y0 = (y1 + y2) / 2 - ent * (n - 1) / 2;
                renforts_h = Array.from({ length: n }, (_, i) => y0 + i * ent);
            } else if ((isReinforced || croise) && renforts_h.length == 1) {
                renforts_h = [(lo + hi) / 2];                        // tout petit : au milieu des pointes
            }
        }

        let display_renforts = [...renforts_h];
        if (type == "3") display_renforts.unshift(renfortBas);


        // ==========================================
        // 2. DESSIN « PLAN D'ATELIER » (Kevin, 21/10/2026)
        // ==========================================
        // Les gars montent l'OSSATURE NUE : le CP 15 mm est pose apres, autour.
        // Cotes donnees depuis le bord NU (2,00 x 2,00 fini -> 1970 x 1970 nu).
        const EP_RV = verticaux45 ? 0.045 : 0.145, EP_RH = 0.045, EP_BF = 0.045;   // verticaux 27x145 a plat (ou 45x145), horizontaux 45, bras 45
        const NL = L - 2 * CP;                               // largeur nue
        const NH = (type == "3") ? H - CP : H - 2 * CP;      // porte : pas de CP en bas
        const DY = (type == "3") ? 0 : CP;                   // decalage fini -> nu en hauteur
        const rv = renforts_v.map(x => x - CP);              // axes des renforts, en nu
        const rh = display_renforts.map(y => y - DY);

        ctx.setTransform(1, 0, 0, 1, 0, 0);
        ctx.fillStyle = "#c4ccd8";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.setTransform(view.zoom, 0, 0, view.zoom, view.panX, view.panY);

        const mG = 30, mD = 230, mH = 230, mB = 105;          // place pour les cotes en haut et a droite
        const yCPbas = (type == "4") ? -CP : 0;              // CP en bas seulement en 4 faces
        const scale = Math.min((canvas.width - mG - mD) / L, (canvas.height - mH - mB) / H);
        const startX = mG + ((canvas.width - mG - mD) - L * scale) / 2 + CP * scale;
        const startY = mH + ((canvas.height - mH - mB) - H * scale) / 2 + (NH + CP) * scale;
        function toX(v) { return startX + v * scale; }
        function toY(v) { return startY - v * scale; }

        const BOIS = "#bcae7c", BOIS_FONCE = "#b3a062", TRAIT = "#2b2b2b";
        function piece(points, couleur) {          // points en metres (repere nu)
            ctx.beginPath();
            points.forEach(([x, y], i) => i ? ctx.lineTo(toX(x), toY(y)) : ctx.moveTo(toX(x), toY(y)));
            ctx.closePath();
            ctx.fillStyle = couleur; ctx.fill();
            ctx.lineWidth = 1.2; ctx.strokeStyle = TRAIT; ctx.stroke();
        }
        function rect(x1, y1, x2, y2, couleur) { piece([[x1, y1], [x2, y1], [x2, y2], [x1, y2]], couleur); }

        // CP 15 mm autour (pose apres le montage de l'ossature)
        const CP_COULEUR = "#8b5a2b";
        if (CP > 0) {
            rect(-CP, NH, NL + CP, NH + CP, CP_COULEUR);
            if (type == "4") rect(-CP, -CP, NL + CP, 0, CP_COULEUR);
            rect(-CP, 0, 0, NH, CP_COULEUR);
            rect(NL, 0, NL + CP, NH, CP_COULEUR);
        }

        // Cadre : traverses haut (et bas en 4 faces) sur toute la largeur, montants entre elles
        const basMontant = (type == "4") ? BA : 0;
        rect(0, NH - BA, NL, NH, BOIS);
        if (type == "4") rect(0, 0, NL, BA, BOIS);
        rect(0, basMontant, BA, NH - BA, BOIS);
        rect(NL - BA, basMontant, NL, NH - BA, BOIS);

        // Renforts horizontaux (entre les montants, derriere les verticaux)
        rh.forEach(y => rect(BA, y - EP_RH / 2, NL - BA, y + EP_RH / 2, BOIS));

        // Bras de force : bande de 45 coupee d'equerre sur le montant et la traverse
        const k = EP_BF * Math.SQRT2;
        function dessinerBras(cx, cy, sx, sy) {
            if (projB <= k) return;
            piece([[cx, cy + sy * projB], [cx + sx * projB, cy], [cx + sx * (projB - k), cy], [cx, cy + sy * (projB - k)]], BOIS);
        }
        const yBas = (type == "3") ? renfortBas - DY + EP_RH / 2 : BA;
        dessinerBras(BA, NH - BA, 1, -1);                       // haut gauche
        if (!deuxAngles) dessinerBras(NL - BA, NH - BA, -1, -1);
        if (!deuxAngles) dessinerBras(BA, yBas, 1, 1);
        dessinerBras(NL - BA, yBas, -1, 1);                     // bas droite

        // Bouts de CP dans les angles interieurs, contre la traverse, pour que le cadre ne bouge pas
        // (Kevin, 21/10/2026) : 4 en fenetre, 2 en porte (pas de traverse en bas)
        const CALE_L = 0.10, CALE_E = 0.015, CALE = "#2b2b2b";
        rect(BA, NH - BA - CALE_E, BA + CALE_L, NH - BA, CALE);
        rect(NL - BA - CALE_L, NH - BA - CALE_E, NL - BA, NH - BA, CALE);
        if (type == "4") {
            rect(BA, BA, BA + CALE_L, BA + CALE_E, CALE);
            rect(NL - BA - CALE_L, BA, NL - BA, BA + CALE_E, CALE);
        }

        // Renforts verticaux : planches 27x145 vues a plat, par-dessus
        // porte : les verticaux descendent jusqu'en bas du mannequin (Kevin, 21/10/2026)
        rv.forEach(x => rect(x - EP_RV / 2, (type == "3") ? 0 : BA, x + EP_RV / 2, NH - BA, BOIS_FONCE));

        // --- Cotes enchainees en mm (depuis le bord nu) ---
        const mm = v => Math.round(v * 1000);
        function fleche(x, y, ang) {
            ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
            ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-20, -7); ctx.lineTo(-20, 7); ctx.closePath();
            ctx.fillStyle = TRAIT; ctx.fill(); ctx.restore();
        }
        function chaine(vals, horizontal, decal) {  // vals : positions en m, croissantes
            ctx.strokeStyle = TRAIT; ctx.lineWidth = 2; ctx.fillStyle = TRAIT;
            ctx.font = "600 46px Inter, Arial, sans-serif"; ctx.textAlign = "center";
            const P = v => horizontal ? [toX(v), toY(NH + CP) - decal] : [toX(NL + CP) + decal, toY(v)];
            vals.forEach(v => {                    // lignes de rappel
                const [px, py] = P(v);
                ctx.beginPath();
                if (horizontal) { ctx.moveTo(px, toY(NH + CP) - 6); ctx.lineTo(px, py - 8); }
                else { ctx.moveTo(toX(NL + CP) + 6, py); ctx.lineTo(px + 8, py); }
                ctx.stroke();
            });
            for (let i = 0; i + 1 < vals.length; i++) {
                const [x1, y1] = P(vals[i]), [x2, y2] = P(vals[i + 1]);
                ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
                const a = Math.atan2(y2 - y1, x2 - x1);
                fleche(x2, y2, a); fleche(x1, y1, a + Math.PI);
                const txt = String(mm(vals[i + 1]) - mm(vals[i]));
                ctx.save(); ctx.translate((x1 + x2) / 2, (y1 + y2) / 2);
                if (!horizontal) ctx.rotate(-Math.PI / 2);
                ctx.fillText(txt, 0, -10); ctx.restore();
            }
        }
        // detail des renforts (s'il y en a), puis la cote totale
        const rhTries = rh.slice().sort((a, b) => a - b);
        if (rv.length) chaine([0, ...rv, NL], true, 62);
        chaine([0, NL], true, rv.length ? 158 : 62);
        if (rhTries.length) chaine([0, ...rhTries, NH], false, 66);
        chaine([0, NH], false, rhTries.length ? 166 : 66);

        ctx.font = "500 34px Inter, Arial, sans-serif"; ctx.textAlign = "center"; ctx.fillStyle = "#2b2b2b";
        ctx.fillText(sansFace ? "Sans face coffrante — " + mm(L) + " x " + mm(H)
                              : "Ossature nue — fini " + mm(L) + " x " + mm(H) + " avec CP",
                     toX(NL / 2), toY(yCPbas) + 66);


        // --- A PREPARER (refonte telephone, Kevin 21/10/2026) ---
        // Longueur des renforts horizontaux interieurs : on deduit de chaque cote
        // 60 mm - 0,5 mm par cm d'epaisseur (fruit) : 16 cm -> 52, 20 -> 50, 25 -> 47,5 (Kevin, 21/10/2026)
        const epCm = lire('epaisseur') * 100;   // saisie en metres
        // Epaisseur non saisie : le plan s'affiche quand meme, seule la longueur manque
        const epOk = !isNaN(epCm) && epCm > 0;
        const deduction = epOk ? (60 - epCm / 2) / 1000 : 0;
        const nbBras = brasCm > 0 ? (deuxAngles ? 2 : 4) : 0;
        const fr = v => v.toLocaleString('fr-FR');

        let html = '';
        html += `
            <div class="ligne-prep">
                <span class="nom">Bras de force</span>
                <span class="valeur">${nbBras ? `${brasCm} <small>cm</small>` : '—'}</span>
                ${deuxAngles && nbBras ? '<span class="detail attention">Dans 2 angles seulement : haut gauche et bas droite</span>' : ''}
                ${brasSurMesure && nbBras ? '<span class="detail attention">À couper sur mesure (longueur pointe à pointe)</span>' : ''}
            </div>`;
        const nbH = display_renforts.length;
        html += `
            <div class="ligne-prep">
                <span class="nom">Renforts horizontaux</span>
                <span class="valeur">${nbH ? nbH + (epOk ? ` <small>×</small> ${fr(mm(NL - 2 * deduction))} <small>mm</small>` : '') : '0'}</span>
                ${nbH ? `<span class="detail">${epOk
                    ? `Longueur entre montants : ossature ${fr(mm(NL))} − 2 × ${fr(deduction * 1000)} mm (épaisseur ${(epCm / 100).toLocaleString('fr-FR', { minimumFractionDigits: 2 })} m)`
                    : `Indiquez l'épaisseur pour avoir la longueur`}${type == "3" ? ` · dont celui du bas à ${fr(Math.round(renfortBas * 100))} cm` : ''}</span>` : ''}
            </div>`;
        html += `
            <div class="ligne-prep">
                <span class="nom">Bouts de CP dans les angles</span>
                <span class="valeur">${type == "3" ? 2 : 4}</span>
                <span class="detail">Contre la traverse, pour que le cadre ne bouge pas</span>
            </div>
            <div class="ligne-prep">
                <span class="nom">Renforts verticaux</span>
                <span class="valeur">${nb_v}</span>
                ${nb_v ? `<span class="detail">${verticaux45 ? 'En 45×145 d’une seule pièce' : 'Chacun en 2 planches 27×145'}${type == "3" ? ' · jusqu’en bas du mannequin' : ''}</span>` : ''}
            </div>
            <p class="note">Théorique : à vérifier au montage. Cotes du plan prises sur l'ossature ${sansFace ? '(sans face coffrante)' : 'nue, sans le CP de 15 mm'}.</p>`;
        resBox.innerHTML = html;
        sauverSaisie();
    }

    // --- INTERACTIONS ZOOM/PAN sur le canvas ---
    function setupCanvasInteraction() {
        const canvas = document.getElementById('monDessin');
        let lastDist = 0;
        let lastMid = null;
        let lastPos = null;
        let isPanning = false;

        function canvasCoords(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height),
            };
        }

        // --- TOUCH (mobile) ---
        const pleinEcran = () => document.querySelector('.visualization').classList.contains('fs');
        canvas.addEventListener('touchstart', (ev) => {
            if (!pleinEcran()) return;          // hors plein ecran : le doigt fait defiler la page
            ev.preventDefault();
            if (ev.touches.length === 2) {
                const dx = ev.touches[0].clientX - ev.touches[1].clientX;
                const dy = ev.touches[0].clientY - ev.touches[1].clientY;
                lastDist = Math.hypot(dx, dy);
                lastMid = {
                    x: (ev.touches[0].clientX + ev.touches[1].clientX) / 2,
                    y: (ev.touches[0].clientY + ev.touches[1].clientY) / 2,
                };
            } else if (ev.touches.length === 1) {
                lastPos = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
                isPanning = true;
            }
        }, { passive: false });

        canvas.addEventListener('touchmove', (ev) => {
            if (!pleinEcran()) return;
            ev.preventDefault();
            if (ev.touches.length === 2) {
                const dx = ev.touches[0].clientX - ev.touches[1].clientX;
                const dy = ev.touches[0].clientY - ev.touches[1].clientY;
                const dist = Math.hypot(dx, dy);
                const mid = {
                    x: (ev.touches[0].clientX + ev.touches[1].clientX) / 2,
                    y: (ev.touches[0].clientY + ev.touches[1].clientY) / 2,
                };
                if (lastDist > 0 && lastMid) {
                    // Pan dû au déplacement du centre
                    const midC = canvasCoords(mid.x, mid.y);
                    const lastMidC = canvasCoords(lastMid.x, lastMid.y);
                    view.panX += (midC.x - lastMidC.x);
                    view.panY += (midC.y - lastMidC.y);
                    // Zoom autour du centre
                    const factor = dist / lastDist;
                    const newZoom = clampZoom(view.zoom * factor);
                    const realFactor = newZoom / view.zoom;
                    view.panX = midC.x - (midC.x - view.panX) * realFactor;
                    view.panY = midC.y - (midC.y - view.panY) * realFactor;
                    view.zoom = newZoom;
                    calculer();
                }
                lastDist = dist;
                lastMid = mid;
            } else if (ev.touches.length === 1 && isPanning && lastPos) {
                const cur = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
                const curC = canvasCoords(cur.x, cur.y);
                const lastC = canvasCoords(lastPos.x, lastPos.y);
                view.panX += (curC.x - lastC.x);
                view.panY += (curC.y - lastC.y);
                lastPos = cur;
                calculer();
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (ev) => {
            if (ev.touches.length === 0) {
                lastDist = 0; lastMid = null; lastPos = null; isPanning = false;
            } else if (ev.touches.length === 1) {
                lastPos = { x: ev.touches[0].clientX, y: ev.touches[0].clientY };
                isPanning = true;
                lastDist = 0; lastMid = null;
            }
        });

        // --- WHEEL (desktop) ---
        canvas.addEventListener('wheel', (ev) => {
            if (!pleinEcran() && !ev.ctrlKey) return;   // la molette fait defiler la page
            ev.preventDefault();
            const c = canvasCoords(ev.clientX, ev.clientY);
            const factor = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
            const newZoom = clampZoom(view.zoom * factor);
            const realFactor = newZoom / view.zoom;
            view.panX = c.x - (c.x - view.panX) * realFactor;
            view.panY = c.y - (c.y - view.panY) * realFactor;
            view.zoom = newZoom;
            calculer();
        }, { passive: false });

        // --- MOUSE DRAG (desktop) ---
        let mouseDown = false;
        let mousePrev = null;
        canvas.addEventListener('mousedown', (ev) => {
            mouseDown = true; mousePrev = { x: ev.clientX, y: ev.clientY };
        });
        window.addEventListener('mousemove', (ev) => {
            if (!mouseDown) return;
            const cur = { x: ev.clientX, y: ev.clientY };
            const curC = canvasCoords(cur.x, cur.y);
            const prevC = canvasCoords(mousePrev.x, mousePrev.y);
            view.panX += (curC.x - prevC.x);
            view.panY += (curC.y - prevC.y);
            mousePrev = cur;
            calculer();
        });
        window.addEventListener('mouseup', () => { mouseDown = false; mousePrev = null; });

        // --- TAP SIMPLE sur l'image -> plein ecran (mobile), re-tap pour revenir ---
        let tStart = null, tMoved = false, tPinch = false, lastToggle = 0;
        canvas.addEventListener('touchstart', (ev) => {
            if (ev.touches.length === 1) { tStart = { x: ev.touches[0].clientX, y: ev.touches[0].clientY, t: Date.now() }; tMoved = false; }
            else { tPinch = true; }
        }, { passive: false });
        canvas.addEventListener('touchmove', (ev) => {
            if (tStart && ev.touches.length === 1 &&
                Math.hypot(ev.touches[0].clientX - tStart.x, ev.touches[0].clientY - tStart.y) > 12) tMoved = true;
        }, { passive: false });
        canvas.addEventListener('touchend', (ev) => {
            if (ev.touches.length === 0) {
                const now = Date.now();
                if (tStart && !tMoved && !tPinch && (now - tStart.t) < 250 && (now - lastToggle) > 320 && !pleinEcran()) {
                    lastToggle = now;
                    toggleFullscreen();
                }
                tStart = null; tPinch = false;
            }
        });
        // double-clic pour reset (desktop)
        canvas.addEventListener('dblclick', resetView);
    }

    window.addEventListener('load', () => {
        ['largeur', 'hauteur', 'epaisseur'].forEach((id, i, ids) => {
            document.getElementById(id).addEventListener('keydown', ev => {
                if (ev.key === 'Enter') { ev.preventDefault(); const n = ids[i + 1]; n ? document.getElementById(n).focus() : ev.target.blur(); }
            });
        });
        setupCanvasInteraction();
        restaurerSaisie();
        calculer();
    });
</script>


    <script>
      // PWA : Service Worker + check de version force (anti-cache iOS)
      (function () {
        const CURRENT_BUILD = document.querySelector('meta[name=build-id]').content;
        let reloading = false;
        function safeReload() {
          if (reloading) return;
          reloading = true;
          if ('caches' in window) {
            caches.keys().then((keys) => Promise.all(keys.map((k) => caches.delete(k))))
              .finally(() => window.location.reload());
          } else {
            window.location.reload();
          }
        }

        // Verifie distant pour build-id != => reload force
        function checkRemoteVersion() {
          fetch('./index.html?_v=' + Date.now(), { cache: 'no-store' })
            .then((r) => r.text())
            .then((txt) => {
              const m = txt.match(/<meta name="build-id" content="([^"]+)"/);
              if (m && m[1] !== CURRENT_BUILD) {
                console.log('Nouvelle version detectee :', m[1]);
                safeReload();
              }
            })
            .catch(() => {});
        }

        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.addEventListener('controllerchange', safeReload);
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').then((reg) => {
              reg.update();
              setInterval(() => reg.update(), 60000);
            });
            // 1er check apres 2s, puis toutes les 60s
            setTimeout(checkRemoteVersion, 2000);
            setInterval(checkRemoteVersion, 60000);
          });
        } else {
          window.addEventListener('load', () => {
            setTimeout(checkRemoteVersion, 2000);
            setInterval(checkRemoteVersion, 60000);
          });
        }
      })();
    </script>
